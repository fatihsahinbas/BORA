[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bora-modem"
version = "0.1.0"
description = "Byte Over Resonant Air - an acoustic OFDM modem that sends files as sound"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Fatih Sahinbas" }]
keywords = ["ofdm", "modem", "acoustic", "dsp", "data-over-sound", "reed-solomon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.24",
    "reedsolo>=1.7",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
bora = "bora.cli:main"

[project.urls]
Homepage = "https://github.com/fatihsahinbas/bora"
Source = "https://github.com/fatihsahinbas/bora"

[tool.hatch.build.targets.wheel]
packages = ["src/bora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
